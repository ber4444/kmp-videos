version: 2
updates:
  # Gradle: version catalog, build scripts, and the AGP/Kotlin/Compose/Dokka plugin
  # classpath. Grouped into a single weekly PR to keep the noise down.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gradle:
        patterns:
          - "*"
    # jackson is no longer suppressed here. Dokka 2.2.0 dropped the jackson 2.12.x pin (and the
    # TypeFactory(LRUMap) call removed in jackson 2.16) that previously made those advisories
    # unfixable, so build.gradle.kts now forces the patched 2.18.x on every classpath.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        versions: ["2.4.10"]

  # GitHub Actions used by the CI workflows (checkout, setup-java, codeql, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
