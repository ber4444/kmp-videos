name: ICSApp
options:
  bundleIdPrefix: com.livingpresence.inner.circle
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ICSApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ics_ios
        excludes:
          - "Info.plist"
    # Gitignored, and written by Gradle's :composeApp:generateIosSecretsXcconfig
    # (a dependency of the framework link) rather than by a build phase here —
    # Xcode reads xcconfigs before any phase runs, so a phase would always be a
    # build behind. Run the Gradle link before xcodebuild, as the README says.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: Info.plist
      properties:
        # Runtime configuration read back by MainViewController.kt out of
        # NSBundle.mainBundle.infoDictionary. Every value comes from the
        # gitignored secrets.properties via the generated Secrets.xcconfig
        # below, and every one degrades gracefully when empty. These belong
        # here, not hand-edited into Info.plist: that file is *generated* by
        # `xcodegen generate`, which silently discards anything not listed here.
        DEEPGRAM_API_KEY: "$(DEEPGRAM_API_KEY)"
        SONIOX_API_KEY: "$(SONIOX_API_KEY)"
        DISCORD_CLIENT_ID: "$(DISCORD_CLIENT_ID)"
        APOLLO_GUILD_ID: "$(APOLLO_GUILD_ID)"
        STREAM_HOST: "$(STREAM_HOST)"
        EXTRA_VIDEOS_URL: "$(EXTRA_VIDEOS_URL)"
        # Discord OAuth2 redirect: discord-<APP_ID>:/authorize/callback, the only
        # mobile shape Discord's portal accepts. DISCORD_REDIRECT_SCHEME is derived
        # from DISCORD_CLIENT_ID by generateIosSecretsXcconfig, so the registration
        # here and the redirect URI DiscordConfig builds cannot drift apart —
        # the same guarantee androidApp/build.gradle.kts gives the manifest.
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER).discord"
            CFBundleURLSchemes:
              - "$(DISCORD_REDIRECT_SCHEME)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # The home-screen and Settings name. CFBundleName still follows
        # PRODUCT_NAME (ICSApp), which is what the target, the .app and the
        # README's xcodebuild commands are keyed to; CFBundleDisplayName is the
        # only one the user ever sees, and it matches androidApp's android:label.
        CFBundleDisplayName: "Apollo Videos"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        # CADisableMinimumFrameDurationOnPhone is REQUIRED by Compose
        # Multiplatform's PlistSanityCheck — without it, the app crashes ~3s
        # after launch (CMP-8608). It enables 120Hz ProMotion frame rates on
        # iPhone and is mandatory for CMP's iOS rendering loop.
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livingpresence.inner.circle.squared
        # ics_ios/Assets.xcassets holds the golden bark on white — the same
        # artwork androidApp draws its adaptive icon from (res/drawable/ypf.png
        # over @color/ic_launcher_background), framed to match.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Kotlin/Native framework is built by Gradle into composeApp/build.
        # We link it as an embedded framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - framework: "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework"
        embed: true
        implicit: true
    postBuildScripts:
      # Compose's iOS resource reader looks under
      # <bundle>/compose-resources/composeResources/..., but nothing puts it
      # there: this target links a prebuilt framework rather than letting Xcode
      # drive Gradle, so CMP's syncComposeResourcesForIos never runs. Without
      # this phase, painterResource(Res.drawable.background_image) throws
      # MissingResourceException and the landing screen kills the app on launch.
      # Gradle assembles the directory as part of the framework link (see
      # composeApp/build.gradle.kts).
      - name: Copy Compose resources
        basedOnDependencyAnalysis: false
        script: |
          case "$SDK_NAME" in
            iphonesimulator*)
              KN_TARGET=iosSimulatorArm64Main
              LINK_TASK=:composeApp:linkDebugFrameworkIosSimulatorArm64
              ;;
            *)
              KN_TARGET=iosArm64Main
              LINK_TASK=:composeApp:linkDebugFrameworkIosArm64
              ;;
          esac
          SRC="${SRCROOT}/../composeApp/build/generated/compose/resourceGenerator/assembledResources/${KN_TARGET}"
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/compose-resources"
          if [ ! -d "$SRC" ]; then
            echo "error: Compose resources missing at $SRC — run ./gradlew $LINK_TASK first"
            exit 1
          fi
          rm -rf "$DEST"
          cp -R "$SRC" "$DEST"
